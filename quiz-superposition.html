<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Superposition Quiz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f4f1ea; max-width: 640px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 26px; margin-bottom: 32px; }
  .question-card { background: #1a1a22; border: 1px solid #2a2a35; border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .question-text { font-weight: 600; margin-bottom: 12px; }
  .option { display: block; width: 100%; text-align: left; background: #23232d; border: 1px solid #333340; color: #f4f1ea; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
  .option.selected { border-color: #6ee7b7; background: #1e2e28; }
  .option.correct-answer { border-color: #6ee7b7; background: #1e2e28; color: #6ee7b7; }
  .option.wrong-answer { border-color: #f87171; background: #2e1e1e; color: #f87171; }
  .option:disabled { cursor: default; }
  .explanation { display: none; margin-top: 12px; padding: 12px 14px; background: #14141b; border-left: 3px solid #6ee7b7; border-radius: 6px; font-size: 13px; color: #c8c8d0; line-height: 1.5; }
  .explanation strong { color: #6ee7b7; }
  button.action { border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
  #submit-btn { background: #6ee7b7; color: #0f0f14; }
  #submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #redo-btn { background: transparent; color: #6ee7b7; border: 1px solid #6ee7b7; margin-left: 10px; }
  #result { margin-top: 20px; font-size: 16px; }
</style>
</head>
<body>
<h1>Superposition Quiz</h1>
<div id="quiz-container"></div>
<button id="submit-btn" class="action">Submit Quiz</button>
<button id="redo-btn" class="action" style="display:none;">Redo Quiz</button>
<p id="result"></p>

<script>
  const TOPIC_NAME = "Superposition";
  const supabaseClient = window.supabase.createClient(
    "https://vmtestykmprdknoiilse.supabase.co",
    "sb_publishable_rxspuE96r68kIW0lWWITPg_PcONREqK"
  );

  const questions = [
    { question: "What is quantum superposition?", options: ["A qubit being destroyed", "A qubit existing in a combination of quantum states", "A qubit becoming permanently 0", "Two computers running simultaneously"], correctIndex: 1, explanation: "Superposition allows a quantum state to be a combination of basis states." },
    { question: "What happens when a qubit in superposition is measured?", options: ["Both states are observed simultaneously", "One definite outcome is obtained", "The qubit disappears", "It always becomes 0"], correctIndex: 1, explanation: "Measurement gives a single definite result." },
    { question: "Which gate can create an equal superposition from |0⟩?", options: ["X gate", "Z gate", "Hadamard gate", "CNOT gate"], correctIndex: 2, explanation: "The Hadamard gate transforms |0⟩ into an equal superposition." },
    { question: "An equal superposition of |0⟩ and |1⟩ has what measurement probabilities?", options: ["100% and 0%", "75% and 25%", "50% and 50%", "25% and 75%"], correctIndex: 2, explanation: "An equal superposition gives a 50% probability for each outcome." },
    { question: "Which statement about superposition is correct?", options: ["It means we directly observe both 0 and 1", "It describes a quantum state before measurement", "It exists only after measurement", "It is the same thing as classical randomness"], correctIndex: 1, explanation: "Superposition describes the quantum state before measurement, not two classical values being directly observed." }
  ];

  const userAnswers = new Array(questions.length).fill(null);
  const optionButtons = questions.map(() => []);
  let previousScore = null;

  const container = document.getElementById("quiz-container");
  const submitBtn = document.getElementById("submit-btn");
  const redoBtn = document.getElementById("redo-btn");
  const resultEl = document.getElementById("result");

  questions.forEach((q, qIndex) => {
    const card = document.createElement("div");
    card.className = "question-card";
    const qText = document.createElement("p");
    qText.className = "question-text";
    qText.textContent = q.question;
    card.appendChild(qText);
    q.options.forEach((optionText, optIndex) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = optionText;
      btn.addEventListener("click", () => {
        userAnswers[qIndex] = optIndex;
        card.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        btn.classList.add("selected");
      });
      card.appendChild(btn);
      optionButtons[qIndex].push(btn);
    });
    const explanation = document.createElement("div");
    explanation.className = "explanation";
    explanation.innerHTML = `<strong>Correct answer:</strong> ${q.options[q.correctIndex]}<br>${q.explanation}`;
    card.appendChild(explanation);
    container.appendChild(card);
  });

  submitBtn.addEventListener("click", async () => {
    if (userAnswers.includes(null)) {
      resultEl.textContent = "Answer every question first.";
      return;
    }
    let score = 0;
    questions.forEach((q, i) => { if (userAnswers[i] === q.correctIndex) score++; });

    questions.forEach((q, qIndex) => {
      optionButtons[qIndex].forEach((btn, optIndex) => {
        btn.disabled = true;
        btn.classList.remove("selected");
        if (optIndex === q.correctIndex) btn.classList.add("correct-answer");
        else if (optIndex === userAnswers[qIndex]) btn.classList.add("wrong-answer");
      });
      container.children[qIndex].querySelector(".explanation").style.display = "block";
    });

    const scoreLine = previousScore === null
      ? `You scored ${score} out of ${questions.length}.`
      : `Previous attempt: ${previousScore}/${questions.length} → This attempt: ${score}/${questions.length}.`;

    resultEl.textContent = `${scoreLine} Saving...`;
    submitBtn.disabled = true;

    const { error } = await supabaseClient.from("QUIZ_SCORES").insert([{ Topic: TOPIC_NAME, Score: score }]);
    resultEl.textContent = error ? `${scoreLine} (saving failed: ${error.message})` : `${scoreLine} Saved!`;

    previousScore = score;
    redoBtn.style.display = "inline-block";
  });

  redoBtn.addEventListener("click", () => {
    userAnswers.fill(null);
    optionButtons.forEach(group => group.forEach(btn => {
      btn.disabled = false;
      btn.classList.remove("selected", "correct-answer", "wrong-answer");
    }));
    container.querySelectorAll(".explanation").forEach(el => el.style.display = "none");
    submitBtn.disabled = false;
    redoBtn.style.display = "none";
    resultEl.textContent = `Previous attempt: ${previousScore}/${questions.length}. Answer again!`;
  });
</script>
</body>
</html>
